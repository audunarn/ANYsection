[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anysection"
version = "0.1.0"
description = "Cross-section models, properties, catalogues, and import/export tooling for the ANY ecosystem."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Audun Nyhus"}]
dependencies = []

[project.optional-dependencies]
scrape = ["beautifulsoup4>=4.12"]
dev = ["pytest>=8", "beautifulsoup4>=4.12"]

[project.scripts]
anysection = "anysection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
